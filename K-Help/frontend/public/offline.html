<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · K-Help</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f0f6ff 0%, #dfeaff 100%);
        color: #172049;
        text-align: center;
      }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 20px; background: linear-gradient(135deg, #4a78f5, #2744b8); color: #fff;
        font-size: 40px; font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 auto 24px; max-width: 320px; line-height: 1.5; color: #475569; }
      button {
        border: 0; border-radius: 14px; padding: 12px 22px;
        background: linear-gradient(135deg, #3b66ee, #2744b8); color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">K</div>
      <h1>You are offline</h1>
      <p>K-Help needs an internet connection to load new information. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
