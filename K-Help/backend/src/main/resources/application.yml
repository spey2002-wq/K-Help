spring:
  application:
    name: khelp-backend

  datasource:
    # Full JDBC URL wins; otherwise it is assembled from DB_HOST/DB_PORT/DB_NAME
    # (used by cloud platforms such as Render that expose host and port separately).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:khelp}}
    username: ${SPRING_DATASOURCE_USERNAME:khelp}
    password: ${SPRING_DATASOURCE_PASSWORD:khelp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must only validate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  servlet:
    multipart:
      # Profile photos; the service also enforces 5 MB and checks the real file type.
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # Cloud platforms inject PORT; locally and in Docker Compose it stays 8080.
  port: ${PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true
  tomcat:
    # Let Tomcat read an oversized upload to the end so the client receives a clean
    # 413 response instead of a dropped connection.
    max-swallow-size: 10MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:khelp-super-secret-development-key-change-me-in-production-0123456789}
    access-token-validity-ms: 900000      # 15 minutes
    refresh-token-validity-ms: 604800000  # 7 days
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    temperature: 0.3
    max-tokens: 1024
    mock-mode: ${AI_MOCK_MODE:true}
    timeout-ms: 60000

  # Comma-separated browser origins allowed to call the API (CORS).
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.khelp: DEBUG
    org.hibernate.SQL: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
logging:
  level:
    com.khelp: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
logging:
  level:
    com.khelp: DEBUG
