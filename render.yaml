# Render Blueprint for K-Help (backend + PostgreSQL + Redis).
# The Next.js frontend is deployed from this same file (see K-Help/README.md).
#
# Paths are relative to the repository root, which contains the K-Help/ folder.

databases:
  - name: khelp-db
    plan: free
    region: singapore
    databaseName: khelp
    user: khelp

services:
  # ---- Redis-compatible cache (Render Key Value) ----
  - type: keyvalue
    name: khelp-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

  # ---- Spring Boot API ----
  - type: web
    name: khelp-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./K-Help/backend/Dockerfile
    dockerContext: ./K-Help/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      # Keep the JVM small enough for the 512 MB free instance.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      # Database (assembled into a JDBC URL by application.yml)
      - key: DB_HOST
        fromDatabase:
          name: khelp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: khelp-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: khelp-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: khelp-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: khelp-db
          property: password
      # Redis
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: khelp-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: khelp-redis
          property: port
      # Security: Render generates a random signing secret once.
      - key: APP_JWT_SECRET
        generateValue: true
      # Browser origin(s) allowed to call the API: the frontend service below.
      # If Render gave your frontend a different URL (a random suffix is added
      # when the name is taken), edit this value in the dashboard.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://khelp-frontend.onrender.com
      # AI middleware (OpenRouter). Paste the key in the dashboard; never commit it.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: ~deepseek/deepseek-pro-latest
      - key: AI_MOCK_MODE
        value: "false"

  # ---- Next.js website ----
  - type: web
    name: khelp-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./K-Help/frontend/Dockerfile
    dockerContext: ./K-Help/frontend
    healthCheckPath: /
    envVars:
      # NEXT_PUBLIC_* values are baked in at build time. These assume the backend
      # is reachable at https://khelp-backend.onrender.com; if Render gave it a
      # different URL, change both values and redeploy this service.
      - key: NEXT_PUBLIC_API_URL
        value: https://khelp-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://khelp-backend.onrender.com/ws
